<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDL rayon bière</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style id="css">
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --ink:#1D1B18; --muted:#6B675F; --line:#DEDDD6;
  --amber:#E3A21A; --amber-deep:#9A6A06; --amber-soft:#FBF0D6;
  --hop:#2E4B3C; --hop-soft:#E3ECE6; --slate:#8C8F94; --danger:#B3261E;
  --shadow:0 1px 2px rgba(29,27,24,.08),0 4px 14px rgba(29,27,24,.06);
  --cond:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16150F; --surface:#221F18; --ink:#F1EEE6; --muted:#A7A195; --line:#3A362C;
    --amber:#F0B436; --amber-deep:#F6CB6A; --amber-soft:#3A2E12;
    --hop:#8DC0A2; --hop-soft:#1F3228; --slate:#7C7F84; --danger:#F28B82;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#16150F; --surface:#221F18; --ink:#F1EEE6; --muted:#A7A195; --line:#3A362C;
  --amber:#F0B436; --amber-deep:#F6CB6A; --amber-soft:#3A2E12;
  --hop:#8DC0A2; --hop-soft:#1F3228; --slate:#7C7F84; --danger:#F28B82;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;max-width:760px;margin:0 auto}
.brand{font:700 22px/1 var(--cond);letter-spacing:.2px}
.brand small{display:block;font:500 14px var(--sans);color:var(--muted);margin-top:4px}
.sync{font-size:13px;color:var(--muted);text-align:right;max-width:45%}

main{max-width:760px;margin:0 auto;padding:16px 16px 190px}
.view{display:none}
.view.on{display:block}

h2{font:700 26px/1.1 var(--cond);margin:22px 0 6px}
h2:first-child{margin-top:4px}
h3{font:600 19px/1.2 var(--cond);margin:0}
p.hint{margin:0 0 12px;color:var(--muted);font-size:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;min-height:44px;font-weight:600}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.amber{background:var(--amber);color:#1D1B18;border-color:var(--amber)}
.btn.ghost{background:transparent}
.btn.small{min-height:36px;padding:6px 10px;font-size:14px}
.btn.danger{color:var(--danger)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.icon-btn{border:none;background:transparent;width:40px;height:40px;border-radius:10px;display:inline-grid;place-items:center;color:var(--muted);font-size:20px}
.icon-btn:hover{background:var(--bg)}

.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg);flex-shrink:0}
.stepper button{width:44px;height:44px;border:none;background:transparent;font-size:22px;font-weight:600}
.stepper input{width:48px;height:44px;border:none;background:transparent;text-align:center;font:700 20px var(--cond);-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper.sm button{width:36px;height:36px;font-size:18px}
.stepper.sm input{width:40px;height:36px;font-size:17px}

.row-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.pill.abi{background:var(--amber-soft);color:var(--amber-deep);border-color:transparent}
.pill.cab{background:var(--hop-soft);color:var(--hop);border-color:transparent}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.seg button{border:none;background:transparent;padding:8px 12px;min-height:40px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:8px 0 12px;scrollbar-width:none}
.chips button{flex-shrink:0;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:14px;font-weight:500}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;min-height:48px}

.brand-group{margin-bottom:14px}
.brand-title{display:flex;align-items:baseline;justify-content:space-between;font:600 18px var(--cond);padding:4px 2px 6px}
.brand-title span.sum{font:500 14px var(--sans);color:var(--muted)}
.prod-main{display:flex;align-items:center;gap:10px}
.sol-open{border:none;background:transparent;color:var(--amber-deep);font-size:13px;font-weight:600;padding:6px 0 0;min-height:32px;text-align:left}
.sol-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.sol-f{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.prod{display:block;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:6px}
.prod.has{border-color:var(--amber)}
.prod .info{flex:1;min-width:0}
.prod .name{font-weight:600;line-height:1.25}
.prod .meta{font-size:13px;color:var(--muted)}
.prod .w-input{width:84px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px;text-align:right;min-height:40px}
.prod .unit{font-size:13px;color:var(--muted)}

.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}

/* Barre de résultat collante */
.live{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.live-inner{max-width:760px;margin:0 auto;padding:10px 16px 0}
.live-nums{display:flex;gap:16px;align-items:flex-end}
.live-nums .big{font:700 34px/1 var(--cond)}
.live-nums .lbl{font-size:12px;color:var(--muted)}
.live-nums .mid{font:600 20px/1 var(--cond)}
/* Mode simulation : inversion claire de l'interface */
body.sim{--bg:#14130E;--surface:#211F17;--ink:#F3F0E8;--muted:#A7A195;--line:#3A362C;--amber:#F0B436;--amber-deep:#F6CB6A;--amber-soft:#3A2E12;--hop:#8DC0A2;--hop-soft:#1F3228;background:var(--bg);color:var(--ink)}
body.sim header.top{background:var(--bg);border-bottom:2px solid var(--amber)}
body.sim .live{background:var(--surface);border-top:2px solid var(--amber)}
.mode-pill{display:inline-block;background:var(--amber);color:#14130E;font:700 12px var(--sans);padding:2px 8px;border-radius:99px;margin-left:8px;vertical-align:middle}
.ecart{display:flex;align-items:center;justify-content:space-between;gap:12px;border-radius:12px;padding:12px 14px;margin-top:10px}
.ecart.ok{background:#E4F1E7;color:#1E5631}
.ecart.ko{background:#FBE4E2;color:#9B241C}
body.sim .ecart.ok{background:#1F3228;color:#9BD5AE}
body.sim .ecart.ko{background:#3A211F;color:#F3A9A2}
.ecart b{font:700 24px var(--cond)}
nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);max-width:760px;margin:6px auto 0}
nav.tabs button{border:none;background:transparent;padding:10px 4px 12px;font:600 14px var(--sans);color:var(--muted);border-top:3px solid transparent}
nav.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--amber)}

/* Linéaire vu de face */
.shelf{margin:10px 0 4px}
.shelf-track{display:flex;height:46px;border-radius:6px;overflow:hidden;background:repeating-linear-gradient(135deg,var(--bg) 0 6px,var(--line) 6px 8px);border:2px solid var(--ink)}
.shelf-track div{height:100%;border-right:2px solid var(--surface);min-width:0}
.shelf-foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.legend{display:grid;gap:6px;margin-top:12px}
.legend .li{display:grid;grid-template-columns:14px 1fr auto auto;gap:10px;align-items:center;font-size:15px}
.legend .sw{width:14px;height:14px;border-radius:3px}
.legend .v{font:600 17px var(--cond);text-align:right;min-width:54px}
.legend .m{color:var(--muted);font-size:13px;text-align:right;min-width:62px}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi .n{font:700 30px/1 var(--cond)}
.kpi .t{font-size:13px;color:var(--muted);margin-top:4px}
.kpi.hero{grid-column:1/-1;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpi.hero .n{font-size:64px;color:var(--amber)}
.kpi.hero .t{color:inherit;opacity:.8;font-size:15px}
.table{width:100%;border-collapse:collapse;font-size:15px}
.table td{padding:8px 0;border-bottom:1px solid var(--line)}
.table td:last-child{text-align:right;font-weight:600}
.sellfi{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--amber-soft);border-radius:12px;padding:12px 14px;margin-top:12px}
.sellfi b{font:700 26px var(--cond)}
.warn{background:var(--amber-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}

.list-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:none}
.list-item .grow{flex:1;min-width:0}
.list-item .inline{width:84px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px;text-align:right;min-height:40px}
.list-item .inline.txt{width:auto;flex:1;text-align:left}

details.rule{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px}
details.rule summary{font-weight:600;cursor:pointer}
details.rule p{margin:8px 0 0;font-size:14px;color:var(--muted)}

/* Feuille modale */
dialog{border:none;border-radius:18px 18px 0 0;padding:0;width:100%;max-width:560px;margin:auto auto 0;background:var(--surface);color:var(--ink);max-height:90%}
dialog::backdrop{background:rgba(0,0,0,.45)}
@media (min-width:640px){dialog{border-radius:18px;margin:auto}}
.sheet{padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.sheet textarea{width:100%;min-height:160px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;font:14px/1.4 ui-monospace,Menlo,Consolas,monospace}
.toast{position:fixed;left:50%;bottom:170px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<template id="markup">
<header class="top">
  <div class="top-row">
    <div class="brand">PDL rayon bière<span class="mode-pill" id="modePill" hidden>SIMULATION</span><small id="storeLabel">Nouveau relevé</small></div>
    <div class="sync" id="syncLabel">Hors ligne</div>
  </div>
</header>

<main>
  <!-- ============ RAYON ============ -->
  <section class="view on" id="v-rayon" aria-label="Rayon">
    <h2>Magasin</h2>
    <div class="card grid2">
      <div class="field"><label for="magasin">Nom du magasin</label><input id="magasin" placeholder="Ex. Carrefour Vénissieux"></div>
      <div class="field"><label for="date">Date du relevé</label><input id="date" type="date"></div>
    </div>

    <h2>Objectif</h2>
    <p class="hint">Objectif de part de linéaire AB InBev pour ce magasin, en pourcentage, en mètres ou en centimètres.</p>
    <div class="card">
      <div class="grid2">
        <div class="field"><label for="objVal">Valeur</label><input id="objVal" inputmode="decimal" placeholder="Ex. 20"></div>
        <div class="field"><label>Unité</label>
          <div class="seg" role="group" aria-label="Unité de l'objectif" id="objUnite">
            <button type="button" data-u="pct">%</button><button type="button" data-u="m">m</button><button type="button" data-u="cm">cm</button>
          </div>
        </div>
      </div>
      <div id="objRecap"></div>
    </div>

    <h2>Éléments du rayon</h2>
    <p class="hint">Un bloc par groupe d'éléments identiques. Un élément mixte (packs et cave à bière) se déclare en segment « Mixte ».</p>
    <div id="elemList"></div>
    <button class="btn amber" id="addElem" style="width:100%">+ Ajouter des éléments</button>

    <h2>Au sol, hors éléments</h2>
    <p class="hint">Uniquement les demi-palettes et palettes posées seules, en dehors d'un élément. Celles intégrées à un élément se saisissent dans le bloc de l'élément. Une demi-palette compte si elle repose sur un support et atteint 4 hauteurs de gerbage (pack Leffe 12x25cl). Posée dans le mauvais sens, elle compte pour deux.</p>
    <div class="card">
      <div class="grid2">
        <div class="field"><label>Demi-palettes seules</label><div data-bind="dpTotal"></div></div>
        <div class="field"><label>Palettes seules</label><div data-bind="palTotal"></div></div>
      </div>
      <div id="solRecap" style="margin-top:12px"></div>
    </div>

    <h2>Mobilier</h2>
    <p class="hint">Mobilier fournisseur : on le compte seulement s'il est intégré physiquement au rack bière.</p>
    <div id="mobList"></div>
    <button class="btn" id="addMob" style="width:100%">+ Ajouter un mobilier</button>

    <div class="btn-row" style="margin-top:24px">
      <button class="btn primary" data-goto="facings" style="flex:1">Passer aux facings</button>
    </div>
  </section>

  <!-- ============ FACINGS ============ -->
  <section class="view" id="v-facings" aria-label="Facings">
    <h2>Facings</h2>
    <p class="hint">Touchez + pour chaque facing. Un facing gerbé (deux packs superposés) compte pour un seul facing.</p>
    <div id="fSol"></div>
    <input class="search" id="fSearch" type="search" placeholder="Chercher une marque, un produit, un format">
    <div class="chips" id="fChips"></div>
    <div id="fList"></div>
    <button class="btn" id="addLocalProd" style="width:100%;margin-top:6px">+ Produit absent de la liste</button>
  </section>

  <!-- ============ RÉSULTAT ============ -->
  <section class="view" id="v-resultat" aria-label="Résultat">
    <h2>Résultat</h2>
    <div id="resBody"></div>
    <div class="btn-row" style="margin-top:16px">
      <button class="btn primary" id="saveReleve" style="flex:1">Enregistrer le relevé</button>
      <button class="btn" id="exportPdf">Exporter en PDF</button>
      <button class="btn" id="newReleve">Nouveau relevé</button>
    </div>
    <h2>Mes relevés</h2>
    <div id="histList"></div>
  </section>

  <!-- ============ SIMULATION ============ -->
  <section class="view" id="v-sim" aria-label="Simulation">
    <h2>Simulation gains et pertes</h2>
    <p class="hint">Partez d'un point de départ connu (P0), puis ajoutez les facings, demi-palettes et palettes gagnés ou perdus pour voir la PDL qui en résulte. Aucun relevé complet n'est nécessaire.</p>

    <div class="card">
      <div class="row-head"><h3>Point de départ (P0)</h3><button class="btn small" id="simFromReleve">Reprendre le relevé</button></div>
      <div class="grid2">
        <div class="field"><label for="simDgp">DGP du rayon</label><input id="simDgp" inputmode="decimal" placeholder="Ex. 4400"></div>
        <div class="field"><label>Unité</label>
          <div class="seg" role="group" aria-label="Unité du DGP" id="simUnite">
            <button type="button" data-su="cm">cm</button><button type="button" data-su="m">m</button>
          </div>
        </div>
        <div class="field"><label for="simPdl">PDL AB InBev de départ (%)</label><input id="simPdl" inputmode="decimal" placeholder="Ex. 15,3"></div>
        <div class="field"><label>Soit un LD de départ</label><div id="simLd0" style="min-height:44px;display:flex;align-items:center;font:700 20px var(--cond)">0 cm</div></div>
      </div>
    </div>

    <h2>Facings gagnés ou perdus</h2>
    <p class="hint">Un gain se saisit en positif, une perte en négatif. Le DGP ne bouge pas : c'est un échange de place avec la concurrence.</p>
    <div id="simList"></div>
    <button class="btn amber" id="addMvt" style="width:100%">+ Ajouter un produit</button>

    <h2>Au sol gagné ou perdu</h2>
    <p class="hint">Une demi-palette ou une palette gagnée s'ajoute au linéaire AB InBev et au DGP du rayon.</p>
    <div class="card">
      <div class="grid2">
        <div class="field"><label>Demi-palettes</label><div data-simbind="dp"></div></div>
        <div class="field"><label>Palettes</label><div data-simbind="pal"></div></div>
      </div>
    </div>

    <h2>Résultat de la simulation</h2>
    <div id="simRes"></div>
    <div class="btn-row" style="margin-top:12px"><button class="btn" id="simReset">Réinitialiser la simulation</button></div>
  </section>

  <!-- ============ RÉFÉRENTIEL ============ -->
  <section class="view" id="v-ref" aria-label="Référentiel">
    <h2>Référentiel</h2>
    <p class="hint" id="refMode"></p>
    <div class="seg" role="group" aria-label="Rubrique" id="refTabs" style="margin-bottom:14px">
      <button data-rt="produits" aria-pressed="true">Produits</button>
      <button data-rt="elements" aria-pressed="false">Éléments</button>
      <button data-rt="mobiliers" aria-pressed="false">Mobilier</button>
      <button data-rt="params" aria-pressed="false">Paramètres</button>
    </div>
    <div id="pubBar" class="warn" hidden style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between">
      <span id="pubMsg"></span>
      <span class="btn-row"><button class="btn amber small" id="pubGo">Publier pour tous les M1</button><button class="btn ghost small" id="pubUndo">Annuler</button></span>
    </div>
    <div id="refBody"></div>
  </section>
</main>

<div class="live">
  <div class="live-inner">
    <div class="live-nums" id="simLive" hidden>
      <div><div class="big" id="simLiveP">0,0 %</div><div class="lbl">PDL simulée</div></div>
      <div><div class="mid" id="simLiveD">0,0 pt</div><div class="lbl">Écart vs P0</div></div>
      <div><div class="mid" id="simLiveL">0 cm</div><div class="lbl">LD simulé</div></div>
    </div>
    <div class="live-nums" id="liveNums">
      <div><div class="big" id="liveP">0,0 %</div><div class="lbl">PDL AB InBev</div></div>
      <div><div class="mid" id="liveD">0 cm</div><div class="lbl">DGP rayon</div></div>
      <div><div class="mid" id="liveL">0 cm</div><div class="lbl">LD AB InBev</div></div>
    </div>
  </div>
  <nav class="tabs" aria-label="Navigation">
    <button data-goto="rayon" aria-current="page">Rayon</button>
    <button data-goto="facings">Facings</button>
    <button data-goto="resultat">Résultat</button>
    <button data-goto="sim">Simulation</button>
    <button data-goto="ref">Réf.</button>
  </nav>
</div>

<dialog id="dlg"><div class="sheet" id="dlgBody"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</template>
<script id="ref-data" type="application/json">null</script>
<script id="app">
document.body.prepend(document.getElementById("markup").content.cloneNode(true));
/* ================================================================
   RÉGLAGE PRINCIPAL

/* Calculs (règles PDL)                                                */
/* ------------------------------------------------------------------ */
function allProducts() { return [...REF.produits, ...R.locaux.map(p => ({ ...p, local: true }))]; }
function elemType(id) { return REF.elements.find(e => e.id === id) || { nom: "Élément supprimé", largeur: 0 }; }

function compute() {
  const P = REF.params;
  let dgpPack = 0, dgpCab = 0, ldPack = 0, ldCab = 0, elemEq = 0;
  const lignes = [];
  for (const g of R.elements) {
    const w = num(elemType(g.typeId).largeur), nb = num(g.nb), et = num(g.etag), virt = num(g.virt);
    const cab = g.segment === "cab" ? et : g.segment === "mixte" ? Math.min(num(g.cabParElem), et) : 0;
    const pack = et - cab;
    const vPack = g.segment === "cab" ? 0 : virt * w, vCab = g.segment === "cab" ? virt * w : 0;
    dgpPack += w * nb * pack + vPack;
    dgpCab += w * nb * cab + vCab;
    elemEq += w === num(P.elemRef) ? nb : (nb * w) / num(P.elemRef || 133);
  }
  let dpCm = 0, palCm = 0, nbDp = 0, nbPal = 0;
  let ldMob = 0;
  for (const m of R.mobiliers) {
    const cat = REF.mobiliers.find(x => x.id === m.mobId); if (!cat) continue;
    const cm = num(cat.cm) * num(m.nb);
    if (m.segment === "cab") dgpCab += cm; else dgpPack += cm;
    if (m.abi) { ldMob += cm; if (m.segment === "cab") ldCab += cm; else ldPack += cm; }
  }
  // Facings
  const parMarque = {};
  let relevePack = 0, releveCab = 0;
  for (const p of allProducts()) {
    const f = num(R.facings[p.id]), d = num(R.dp[p.id]), pa = num(R.pal[p.id]);
    if (!f && !d && !pa) continue;
    const sol = d * num(P.dp) + pa * num(P.pal);
    nbDp += d; nbPal += pa;
    const cmF = f * num(p.largeur);
    if (p.segment === "cab") releveCab += cmF; else relevePack += cmF;
    relevePack += sol;
    // Les demi-palettes et palettes sont dans le DGP packs (totaux saisis dans Rayon)
    if (p.abi) { if (p.segment === "cab") ldCab += cmF; else ldPack += cmF; ldPack += sol; }
    const cm = cmF + sol;
    const k = p.marque || "Sans marque";
    parMarque[k] = parMarque[k] || { cm: 0, abi: p.abi, facings: 0 };
    parMarque[k].cm += cm; parMarque[k].facings += f;
  }
  // Totaux au sol : le DGP prend le total saisi (ou le total attribué s'il est plus élevé)
  const elDp = R.elements.reduce((a, g) => a + num(g.dp), 0), elPal = R.elements.reduce((a, g) => a + num(g.pal), 0);
  const saisiDp = num(R.dpTotal) + elDp, saisiPal = num(R.palTotal) + elPal;
  const totDp = Math.max(saisiDp, nbDp), totPal = Math.max(saisiPal, nbPal);
  dpCm = totDp * num(P.dp); palCm = totPal * num(P.pal);
  dgpPack += dpCm + palCm;
  const naDp = totDp - nbDp, naPal = totPal - nbPal;
  const naCm = naDp * num(P.dp) + naPal * num(P.pal);
  if (naCm) { parMarque["Sol non attribué (hors AB InBev)"] = { cm: naCm, abi: false, facings: 0 }; relevePack += naCm; }
  if (ldMob) { parMarque["Mobilier AB InBev"] = { cm: ldMob, abi: true, facings: 0 }; }
  const dgp = dgpPack + dgpCab, ld = ldPack + ldCab;
  const releve = relevePack + releveCab + ldMob;
  return {
    dgp, dgpPack, dgpCab, ld, ldPack, ldCab, dpCm, palCm, nbDp, nbPal, totDp, totPal, naDp, naPal,
    depasse: nbDp > saisiDp || nbPal > saisiPal, elDp, elPal,
    pdl: dgp ? ld / dgp : 0, pdlPack: dgpPack ? ldPack / dgpPack : 0, pdlCab: dgpCab ? ldCab / dgpCab : 0,
    nbElem: Math.round(elemEq + 1e-9), elemEq, parMarque, releve
  };
}

function stepperHTML(val, key, sm) {
  return `<div class="stepper${sm ? " sm" : ""}"><button type="button" data-step="-1" data-key="${key}" aria-label="Moins">−</button><input inputmode="numeric" value="${num(val)}" data-key="${key}" aria-label="Quantité"><button type="button" data-step="1" data-key="${key}" aria-label="Plus">+</button></div>`;
}
function getPath(obj, path) { return path.split(".").reduce((o, k) => o?.[k], obj); }
function setPath(obj, path, v) { const ks = path.split("."); const last = ks.pop(); ks.reduce((o, k) => o[k], obj)[last] = v; }

/* Clés : "r:dp.total"  -> R ; "el:<id>:nb" -> élément ; "mob:<id>:nb" ; "f:<prodId>" */
function readKey(key) {
  const [scope, a, b] = key.split(":");
  if (scope === "r") return getPath(R, a);
  if (scope === "el") return R.elements.find(x => x.id === a)?.[b];
  if (scope === "mob") return R.mobiliers.find(x => x.id === a)?.[b];
  if (scope === "sim") return SIM[a] || 0;
  if (scope === "mvt") return (SIM.mvts.find(x => x.id === a) || {}).delta || 0;
  if (scope === "f") return R.facings[a] || 0;
  if (scope === "dp") return R.dp[a] || 0;
  if (scope === "pal") return R.pal[a] || 0;
}
function writeKey(key, v) {
  const [scope, a, b] = key.split(":");
  if (scope !== "sim" && scope !== "mvt") v = Math.max(0, v);
  if (scope === "sim") { SIM[a] = v; saveSim(); renderSimRes(); return; }
  if (scope === "mvt") { const m = SIM.mvts.find(x => x.id === a); if (m) m.delta = v; saveSim(); renderSimRes(); return; }
  if (scope === "r") setPath(R, a, v);
  else if (scope === "el") { const g = R.elements.find(x => x.id === a); if (g) g[b] = v; }
  else if (scope === "mob") { const m = R.mobiliers.find(x => x.id === a); if (m) m[b] = v; }
  else if (scope === "f") { if (v) R.facings[a] = v; else delete R.facings[a]; }
  else if (scope === "dp") { if (v) R.dp[a] = v; else delete R.dp[a]; }
  else if (scope === "pal") { if (v) R.pal[a] = v; else delete R.pal[a]; }
  saveDraft(); refreshLive();
}

document.addEventListener("click", e => {
  const st = e.target.closest("[data-step]");
  if (st) {
    const key = st.dataset.key, v = num(readKey(key)) + num(st.dataset.step);
    writeKey(key, v);
    const inp = st.parentElement.querySelector("input"); inp.value = Math.max(0, v);
    if (/^(f|dp|pal):/.test(key)) updateFacingRow(key.split(":")[1]);
    if (!/^(f|dp|pal):/.test(key)) renderSolPills();
    if (/^el:.*:(dp|pal)$/.test(key)) renderElems();
    return;
  }
  const go = e.target.closest("[data-goto]");
  if (go) { show(go.dataset.goto); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.matches(".stepper input[data-key]")) {
    writeKey(t.dataset.key, num(t.value));
    if (/^(f|dp|pal):/.test(t.dataset.key)) updateFacingRow(t.dataset.key.split(":")[1]);
    if (!/^(f|dp|pal):/.test(t.dataset.key)) renderSolPills();
  }
});

function show(v) {
  document.querySelectorAll(".view").forEach(s => s.classList.toggle("on", s.id === "v-" + v));
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.goto === v ? "page" : "false"));
  if (v === "facings") renderFacings();
  if (v === "resultat") { renderResult(); renderHist(); }
  if (v === "ref") renderRef();
  if (v === "sim") renderSim();
  document.body.classList.toggle("sim", v === "sim");
  $("#modePill").hidden = v !== "sim";
  $("#liveNums").hidden = v === "sim";
  $("#simLive").hidden = v !== "sim";
  if (v === "sim") renderSimRes();
  window.scrollTo({ top: 0 });
}

function renderRayon() {

  document.querySelectorAll("[data-bind]").forEach(el => { el.innerHTML = stepperHTML(getPath(R, el.dataset.bind), "r:" + el.dataset.bind); });
  renderElems(); renderMobs(); renderSolPills(); renderObjectif(); refreshLive();
  updateLd0();
}
function hasSol(id) { return !!(R.dp[id] || R.pal[id]); }
function renderSolPills() {
  const c = compute();
  const lignes = allProducts().filter(p => R.dp[p.id] || R.pal[p.id]).map(p => {
    const parts = [];
    if (R.dp[p.id]) parts.push(`${R.dp[p.id]} DP`);
    if (R.pal[p.id]) parts.push(`${R.pal[p.id]} palette${R.pal[p.id] > 1 ? "s" : ""}`);
    return `<div class="list-item"><div class="grow">${esc(p.marque)} ${esc(p.format)} ${p.abi ? `<span class="pill abi">AB InBev</span>` : ""}</div><span style="font-size:14px">${parts.join(", ")}</span></div>`;

const FILTERS = [["tout","Tout"],["abi","AB InBev"],["conc","Concurrence"],["pack","Packs"],["cab","Cave à bière"],["can","CAN"],["nab","NAB"],["saisis","Déjà saisis"]];
const isCan = p => /^can\b/i.test(String(p.format || ""));
const isNab = p => /0\s*[,.]\s*0/.test(`${p.nom || ""} ${p.format || ""}`);
function renderChips() {
  $("#fChips").innerHTML = FILTERS.map(([k, l]) => `<button type="button" data-f="${k}" aria-pressed="${fFilter === k}">${l}</button>`).join("");
}
$("#fChips").onclick = e => { const b = e.target.closest("[data-f]"); if (!b) return; fFilter = b.dataset.f; renderFacings(); };
$("#fSearch").addEventListener("input", e => { fQuery = e.target.value.toLowerCase(); renderFacings(); });

function renderFacings() {
  renderChips(); renderSolPills();
  const q = fQuery.trim();
  const list = allProducts().filter(p => {
    if (fFilter === "abi" && !p.abi) return false;
    if (fFilter === "conc" && p.abi) return false;
    if (fFilter === "pack" && p.segment !== "pack") return false;
    if (fFilter === "cab" && p.segment !== "cab") return false;
    if (fFilter === "can" && !isCan(p)) return false;
    if (fFilter === "nab" && !isNab(p)) return false;
    if (fFilter === "saisis" && !R.facings[p.id] && !hasSol(p.id)) return false;
    if (q && !`${p.marque} ${p.nom} ${p.format}`.toLowerCase().includes(q)) return false;
    return true;
  });
  const groups = {};
  list.forEach(p => (groups[p.marque || "Sans marque"] ||= []).push(p));
  const names = Object.keys(groups).sort((a, b) => {
    const A = groups[a][0].abi, B = groups[b][0].abi;
    return A === B ? a.localeCompare(b, "fr") : A ? -1 : 1;
  });
  $("#fList").innerHTML = names.map(m => `
    <div class="brand-group">
      <div class="brand-title"><span>${esc(m)} ${groups[m][0].abi ? `<span class="pill abi">AB InBev</span>` : ""}</span><span class="sum" data-bsum="${esc(m)}"></span></div>
      ${groups[m].map(p => `
        <div class="prod ${R.facings[p.id] || hasSol(p.id) ? "has" : ""}" data-pid="${p.id}">
          <div class="prod-main">
            <div class="info">
              <div class="name">${esc(p.format)}</div>
              <div class="meta">${esc(p.nom)} · ${num(p.largeur).toLocaleString("fr-FR")} cm ${p.segment === "cab" ? `<span class="pill cab">CAB</span>` : ""} ${p.local ? `<span class="pill">Ajouté sur ce relevé</span>` : ""}</div>
            </div>
            ${stepperHTML(R.facings[p.id], "f:" + p.id)}
          </div>
          ${hasSol(p.id) || solOpen.has(p.id) ? solHTML(p.id) : `<button type="button" class="sol-open" data-solopen="${p.id}">+ Demi-palette ou palette</button>`}
        </div>`).join("")}
    </div>`).join("") || `<div class="empty">Aucun produit ne correspond. Changez le filtre ou ajoutez le produit.</div>`;
  names.forEach(updateBrandSum);
}
const solOpen = new Set();

    <div class="sol-f"><span>Demi-palettes</span>${stepperHTML(R.dp[id], "dp:" + id, true)}</div>

  const el = document.querySelector(`[data-bsum="${CSS.escape(m)}"]`); if (!el) return;

const ABI_COLORS = ["#E3A21A","#C7850B","#F2C766","#9A6A06","#F5D98E","#B8791A"];
const COMP_COLORS = ["#7D8187","#A3A7AC","#5F6368","#C2C5C9","#8E9398","#6F7378"];
function objectifCm(dgp) {
  const o = R.objectif || {}; const v = num(o.valeur);
  if (!v) return 0;
  return o.unite === "pct" ? (v / 100) * dgp : o.unite === "m" ? v * 100 : v;
}
function ecartHTML(ld, dgp) {
  const cible = objectifCm(dgp); if (!cible) return "";
  const e = ld - cible, ok = e >= 0;
  const abs = Math.abs(e);
  const detail = `${fmtCm(abs)} (${(abs / 100).toLocaleString("fr-FR", { maximumFractionDigits: 2 })} m)`;
  return `<div class="ecart ${ok ? "ok" : "ko"}">
    <div><div style="font-size:13px;opacity:.85">Objectif : ${fmtCm(cible)}${R.objectif.unite === "pct" ? ` (${num(R.objectif.valeur).toLocaleString("fr-FR")} % du DGP)` : ""}</div>
    <div style="font-weight:600">${ok ? "Objectif atteint" : "Objectif non atteint"}</div></div>
    <b>${ok ? "+" : "-"} ${detail}</b>
  </div>`;
}
function renderObjectif() {
  const o = R.objectif || { valeur: 0, unite: "pct" };
  const inp = $("#objVal"); if (document.activeElement !== inp) inp.value = o.valeur || "";
  document.querySelectorAll("#objUnite [data-u]").forEach(b => b.setAttribute("aria-pressed", b.dataset.u === o.unite));
  const c = compute();
  $("#objRecap").innerHTML = num(o.valeur) ? (c.dgp ? ecartHTML(c.ld, c.dgp) : `<p class="hint" style="margin:10px 0 0">L'écart s'affichera dès que le rayon sera renseigné.</p>`) : "";
}
$("#objVal").addEventListener("input", e => { R.objectif = { ...R.objectif, valeur: num(e.target.value) }; LS.set("pdl.objectif", R.objectif); saveDraft(); renderObjectif(); refreshLive(); });
$("#objUnite").addEventListener("click", e => { const b = e.target.closest("[data-u]"); if (!b) return; R.objectif = { ...R.objectif, unite: b.dataset.u }; LS.set("pdl.objectif", R.objectif); saveDraft(); renderObjectif(); refreshLive(); });

function refreshLive() {

      <div class="kpi"><div class="n">${c.nbElem}</div><div class="t">Éléments (équiv. ${REF.params.elemRef} cm : ${c.elemEq.toLocaleString("fr-FR",{maximumFractionDigits:2})})</div></div>

        ${reste > 1 ? `<div class="li"><span class="sw" style="background:repeating-linear-gradient(135deg,var(--bg) 0 3px,var(--line) 3px 5px);border:1px solid var(--line)"></span><span style="color:var(--muted)">Non relevé</span><span class="m">${fmtCm(reste)}</span><span class="v">${fmtPct(reste / c.dgp)}</span></div>` : ""}

/* ------------------------------------------------------------------ */
/* Simulation gains et pertes                                          */
/* ------------------------------------------------------------------ */
function simCompute() {
  const P = REF.params;
  const dgp0 = SIM.unite === "m" ? num(SIM.dgp0) * 100 : num(SIM.dgp0);
  const ld0 = (num(SIM.pdl0) / 100) * dgp0;
  let dFacings = 0;
  for (const m of SIM.mvts) {
    const p = allProducts().find(x => x.id === m.prodId); if (!p) continue;
    dFacings += num(m.delta) * num(p.largeur);
  }
  const dSol = num(SIM.dp) * num(P.dp) + num(SIM.pal) * num(P.pal);
  const dgp = dgp0 + dSol, ld = ld0 + dFacings + dSol;
  return { dgp0, ld0, pdl0: dgp0 ? ld0 / dgp0 : 0, dgp, ld, pdl: dgp ? ld / dgp : 0, dFacings, dSol };
}
function renderSim() {
  const d = $("#simDgp"); if (document.activeElement !== d) d.value = SIM.dgp0 || "";
  const q = $("#simPdl"); if (document.activeElement !== q) q.value = SIM.pdl0 || "";
  document.querySelectorAll("#simUnite [data-su]").forEach(b => b.setAttribute("aria-pressed", b.dataset.su === SIM.unite));
  document.querySelectorAll("[data-simbind]").forEach(el => { el.innerHTML = stepperHTML(SIM[el.dataset.simbind], "sim:" + el.dataset.simbind); });
  const opts = sel => allProducts().slice().sort((a, b) => (b.abi - a.abi) || a.marque.localeCompare(b.marque, "fr"))
    .map(p => `<option value="${p.id}" ${p.id === sel ? "selected" : ""}>${esc(p.marque)} ${esc(p.nom)} · ${esc(p.format)} (${num(p.largeur).toLocaleString("fr-FR")} cm)</option>`).join("");
  $("#simList").innerHTML = SIM.mvts.map(m => {
    const p = allProducts().find(x => x.id === m.prodId);
    const cm = p ? num(m.delta) * num(p.largeur) : 0;
    return `<div class="card" data-mvt="${m.id}">
      <div class="row-head">
        <select data-mvtprod aria-label="Produit" style="flex:1;min-width:0;max-width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 10px;min-height:44px">${opts(m.prodId)}</select>
        <button class="icon-btn" data-delmvt aria-label="Supprimer">✕</button>
      </div>
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        ${stepperHTML(m.delta, "mvt:" + m.id)}
        <span style="font:600 18px var(--cond);color:${cm >= 0 ? "var(--hop)" : "var(--danger)"}">${cm >= 0 ? "+" : "-"} ${fmtCm(Math.abs(cm))}</span>
      </div>
    </div>`;

const PDF_LIBS = [
  "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",
  "https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"
];
let pdfLibsReady = null;
function loadPdfLibs() {
  if (pdfLibsReady) return pdfLibsReady;
  pdfLibsReady = PDF_LIBS.reduce((chain, src) => chain.then(() => new Promise((res, rej) => {
    const sc = document.createElement("script"); sc.src = src; sc.onload = res;
    sc.onerror = () => rej(new Error("load")); document.head.appendChild(sc);
  })), Promise.resolve()).catch(e => { pdfLibsReady = null; throw e; });
  return pdfLibsReady;
}
function brandList(c) {
  let ai = 0, ci = 0;
  return Object.entries(c.parMarque).sort((a, b) => (b[1].abi - a[1].abi) || (b[1].cm - a[1].cm))
    .map(([n, v]) => ({ n, ...v, col: v.abi ? ABI_COLORS[ai++ % ABI_COLORS.length] : COMP_COLORS[ci++ % COMP_COLORS.length] }));
}
function productLines(c) {
  const P = REF.params, out = [];
  for (const p of allProducts()) {
    const f = num(R.facings[p.id]), d = num(R.dp[p.id]), pa = num(R.pal[p.id]);
    if (!f && !d && !pa) continue;
    const cm = f * num(p.largeur) + d * num(P.dp) + pa * num(P.pal);
    out.push({ p, f, d, pa, cm, pdl: c.dgp ? cm / c.dgp : 0 });
  }
  return out.sort((a, b) => (b.p.abi - a.p.abi) || (b.cm - a.cm));
}
async function exportPdf() {

  try {
    await loadPdfLibs();
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "mm", format: "a4" });
    const T = v => String(v ?? "").replace(/[\u202f\u00a0]/g, " ").replace(/\u2212/g, "-");

    doc.setTextColor(...AMBER); doc.setFont("helvetica", "bold"); doc.setFontSize(22);
    doc.text(T(fmtPct(c.pdl)), W - M, 15, { align: "right" });
    doc.setFontSize(8); doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "normal");
    doc.text("PDL AB InBev", W - M, 21, { align: "right" });

    // Indicateurs
    const kpis = [

      doc.roundedRect(x, y, kw, 20, 2, 2, "FD");
      doc.setFont("helvetica", "bold"); doc.setFontSize(15); doc.setTextColor(...INK); doc.text(T(v), x + 4, y + 9);
      doc.setFont("helvetica", "normal"); doc.setFontSize(7.5); doc.setTextColor(...MUTED); doc.text(T(l), x + 4, y + 15.5);
    });

    // DGP SellFi

    // Rayon vu de face

    brands.forEach(b => { const w = Math.min(bw, b.cm / c.dgp * bw); doc.setFillColor(...rgb(b.col)); doc.rect(x, y, w, 10, "F"); x += w; });
    doc.setDrawColor(...INK); doc.setLineWidth(0.5); doc.rect(M, y, bw, 10); doc.setLineWidth(0.2);
    y += 14;
    const reste = Math.max(0, c.dgp - c.releve);
    const brandRows = brands.map(b => ["", T(b.n), b.abi ? "Oui" : "Non", T(fmtCm(b.cm)), T(fmtPct(b.cm / c.dgp))]);
    if (reste > 1) brandRows.push(["", "Non relevé", "", T(fmtCm(reste)), T(fmtPct(reste / c.dgp))]);
    table({
      head: [["", "Marque", "AB InBev", "Linéaire", "PDL"]], body: brandRows,
      columnStyles: { 0: { cellWidth: 6 }, 3: { halign: "right" }, 4: { halign: "right", fontStyle: "bold" } },
      didDrawCell: d => {

        }

    });

    // Détail du calcul

    table({
      body: [

        ["DGP cave à bière", T(fmtCm(c.dgpCab))],

        ...(objectifCm(c.dgp) ? [["Objectif", T(`${fmtCm(objectifCm(c.dgp))}, écart ${c.ld - objectifCm(c.dgp) >= 0 ? "+" : "-"}${fmtCm(Math.abs(c.ld - objectifCm(c.dgp)))}`)]] : [])
      ],
      columnStyles: { 1: { halign: "right", fontStyle: "bold" } },

      columnStyles: { 1: { halign: "right" }, 2: { halign: "right" }, 4: { halign: "right" }, 5: { halign: "right" }, 6: { halign: "right" } }

      return [T(cat.nom), String(num(m.nb)), T(fmtCm(num(cat.cm) * num(m.nb))), m.segment === "cab" ? "Cave à bière" : "Packs", m.abi ? "Oui" : "Non"]; });

      styles: { font: "helvetica", fontSize: 8, cellPadding: 1.6, textColor: INK, lineColor: [222, 221, 214], lineWidth: { bottom: 0.2 } },
      columnStyles: { 4: { halign: "right" }, 5: { halign: "right" }, 6: { halign: "right" }, 7: { halign: "right" }, 8: { halign: "right", fontStyle: "bold" } },

async function deliverFile(blob, filename) {
  let dl = null;
  if (window.claude && window.claude.use) { try { dl = await window.claude.use("downloads"); } catch {} }
  if (dl) {
    try { await dl.save({ filename, data: blob }); toast("PDF enregistré"); }
    catch (e) { if (e && e.code !== "declined") toast("Téléchargement impossible ici"); }
    return;
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast("PDF téléchargé");
}

      </div>
      <p class="hint">${REF.produits.length} produits · largeur = encombrement d'un facing en façade, en cm.</p>
      ${(REF.supprimes || []).length ? `<button class="btn small" id="restoreRem">Rétablir les ${REF.supprimes.length} produit(s) retiré(s) du référentiel commun</button>` : ""}`;
    if ($("#restoreRem")) $("#restoreRem").onclick = restoreRemoved;
    $("#refSearch").oninput = e => { renderRef.q = e.target.value; const pos = e.target.selectionStart; renderRef(); const s = $("#refSearch"); s.focus(); s.setSelectionRange(pos, pos); };
    if (canEditRef) { $("#addProd").onclick = () => productForm(null); $("#pasteProd").onclick = pasteForm; }
  }
  if (refTab === "elements") {
    body.innerHTML = `
      <p class="hint">Types d'éléments proposés dans le relevé, avec leur largeur réelle.</p>
      <div class="card" style="padding:4px 14px">
        ${REF.elements.map(e => `<div class="list-item" data-re="${e.id}">
          <input class="inline txt" value="${esc(e.nom)}" data-ef="nom" aria-label="Nom" ${ro}>
          <input class="inline" inputmode="decimal" value="${e.largeur}" data-ef="largeur" aria-label="Largeur en cm" ${ro}><span style="font-size:13px;color:var(--muted)">cm</span>
          ${canEditRef ? `<button class="icon-btn" data-edel aria-label="Supprimer">✕</button>` : ""}</div>`).join("")}
      </div>
      ${canEditRef ? `<button class="btn amber" id="addEl" style="width:100%">+ Nouveau type d'élément</button>` : ""}`;
    if (canEditRef) $("#addEl").onclick = () => { REF.elements.push({ id: uid(), nom: "Nouvel élément", largeur: 133 }); saveRef(); renderRef(); };
  }
  if (refTab === "mobiliers") {
    body.innerHTML = `
      <p class="hint">Cochez AB InBev pour que le mobilier compte aussi dans le LD.</p>
      <div class="card" style="padding:4px 14px">
        ${REF.mobiliers.map(m => `<div class="list-item" data-rm="${m.id}">
          <input class="inline txt" value="${esc(m.nom)}" data-mf2="nom" aria-label="Nom" ${ro}>
          <input class="inline" inputmode="decimal" value="${m.cm}" data-mf2="cm" aria-label="Dimension en cm" ${ro}><span style="font-size:13px;color:var(--muted)">cm</span>
          <label style="display:flex;gap:4px;align-items:center;font-size:13px"><input type="checkbox" data-mf2="abi" ${m.abi ? "checked" : ""} ${ro}>ABI</label>
          ${canEditRef ? `<button class="icon-btn" data-mdel aria-label="Supprimer">✕</button>` : ""}</div>`).join("")}
      </div>
      ${canEditRef ? `<button class="btn amber" id="addM" style="width:100%">+ Nouveau mobilier</button>` : ""}`;
    if (canEditRef) $("#addM").onclick = () => { REF.mobiliers.push({ id: uid(), nom: "Nouveau mobilier", cm: 100, abi: false }); saveRef(); renderRef(); };
  }
  if (refTab === "params") {
    const P = REF.params;
    body.innerHTML = `
      <div class="card grid2">
        <div class="field"><label>Demi-palette (cm)</label><input inputmode="decimal" data-pp="dp" value="${P.dp}" ${ro}></div>
        <div class="field"><label>Palette (cm)</label><input inputmode="decimal" data-pp="pal" value="${P.pal}" ${ro}></div>
        <div class="field"><label>Élément de référence (cm)</label><input inputmode="decimal" data-pp="elemRef" value="${P.elemRef}" ${ro}></div>
        <div class="field"><label>Étagères par défaut</label><input inputmode="numeric" data-pp="etag" value="${P.etag}" ${ro}></div>
      </div>
      ${canEditRef ? `<div class="btn-row" style="margin-top:16px"><button class="btn danger" id="resetRef">Revenir au référentiel d'origine</button></div>` : ""}`;
    if (canEditRef) $("#resetRef").onclick = () => { if (confirm("Remplacer tout le référentiel par la version d'origine ?")) { REF = { ...structuredClone(DEFAULT_REF), rev: PUBLISHED.rev || 0 }; saveRef(); renderRef(); refreshLive(); } };
  }
}
$("#refBody").addEventListener("change", e => {
  if (!canEditRef) return;
  const t = e.target;
  const rp = t.closest("[data-rp]"); if (rp && t.matches("[data-pw]")) { REF.produits.find(p => p.id === rp.dataset.rp).largeur = num(t.value); REF.exemple = false; }
  const re = t.closest("[data-re]"); if (re && t.dataset.ef) { const el = REF.elements.find(x => x.id === re.dataset.re); el[t.dataset.ef] = t.dataset.ef === "nom" ? t.value : num(t.value); }
  const rm = t.closest("[data-rm]"); if (rm && t.dataset.mf2) { const m = REF.mobiliers.find(x => x.id === rm.dataset.rm); const f = t.dataset.mf2; m[f] = f === "abi" ? t.checked : f === "cm" ? num(t.value) : t.value; }
  if (t.dataset.pp) REF.params[t.dataset.pp] = num(t.value);
  saveRef(); refreshLive(); renderSolPills();
});
$("#refBody").addEventListener("click", e => {
  if (!canEditRef) return;
  const rp = e.target.closest("[data-rp]");
  if (rp && e.target.closest("[data-pedit]")) productForm(REF.produits.find(p => p.id === rp.dataset.rp));
  if (rp && e.target.closest("[data-pdel]")) removeProduct(REF.produits.find(p => p.id === rp.dataset.rp));
  const re = e.target.closest("[data-re]");
  if (re && e.target.closest("[data-edel]")) {
    if (REF.elements.length === 1) { toast("Gardez au moins un type d'élément"); return; }
    REF.elements = REF.elements.filter(x => x.id !== re.dataset.re); saveRef(); renderRef(); renderElems(); refreshLive();
  }
  const rm = e.target.closest("[data-rm]");
  if (rm && e.target.closest("[data-mdel]")) { REF.mobiliers = REF.mobiliers.filter(x => x.id !== rm.dataset.rm); saveRef(); renderRef(); renderMobs(); refreshLive(); }
});

function removeProduct(p) {
  if (!p || !confirm(`Retirer ${p.marque} ${p.nom} ${p.format} du référentiel ?`)) return false;
  REF.produits = REF.produits.filter(x => x.id !== p.id);
  if (!isAdmin && isPublished("produits", p.id)) REF.supprimes = [...new Set([...(REF.supprimes || []), p.id])];
  delete R.facings[p.id]; delete R.dp[p.id]; delete R.pal[p.id];
  saveRef(); saveDraft(); renderRef(); renderSolPills(); refreshLive();
  toast("Produit retiré");
  return true;
}
function restoreRemoved() {
  for (const id of REF.supprimes || []) {
    const p = (PUBLISHED.produits || []).find(x => x.id === id);
    if (p && !REF.produits.some(x => x.id === id)) REF.produits.push(structuredClone(p));
  }
  REF.supprimes = []; saveRef(); renderRef(); toast("Produits rétablis");
}

/* Formulaire produit (référentiel ou produit local au relevé) */
function productForm(p, local = false) {
  const editing = !!p;
  p = p || { marque: "", nom: "", format: "", largeur: "", segment: "pack", abi: false };
  const marques = [...new Set(REF.produits.map(x => x.marque))].sort((a, b) => a.localeCompare(b, "fr"));
  const formats = [...new Set(REF.produits.map(x => x.format))].sort((a, b) => a.localeCompare(b, "fr"));
  $("#dlgBody").innerHTML = `
    <h3 style="font-size:24px">${editing ? "Modifier le produit" : local ? "Produit pour ce relevé" : "Nouveau produit"}</h3>
    ${local && !canEditRef ? `<p class="hint">Ce produit n'existe que dans ce relevé. Signalez-le à l'administrateur pour l'ajouter au référentiel.</p>` : ""}
    <div class="grid2">
      <div class="field"><label for="pMarque">Marque</label><input id="pMarque" list="dlMarques" value="${esc(p.marque)}" placeholder="Leffe"></div>
      <div class="field"><label for="pNom">Produit</label><input id="pNom" value="${esc(p.nom)}" placeholder="Blonde"></div>
      <div class="field"><label for="pFormat">Format</label><input id="pFormat" list="dlFormats" value="${esc(p.format)}" placeholder="Pack 12x25cl"></div>
      <div class="field"><label for="pLarg">Largeur d'un facing (cm)</label><input id="pLarg" inputmode="decimal" value="${p.largeur}" placeholder="26"></div>
    </div>
    <datalist id="dlMarques">${marques.map(m => `<option value="${esc(m)}">`).join("")}</datalist>
    <datalist id="dlFormats">${formats.map(m => `<option value="${esc(m)}">`).join("")}</datalist>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <div class="seg" role="group" aria-label="Segment" id="pSeg">
        <button type="button" data-v="pack" aria-pressed="${p.segment !== "cab"}">Packs, canettes, fûts</button>
        <button type="button" data-v="cab" aria-pressed="${p.segment === "cab"}">Cave à bière</button>
      </div>
      <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="pAbi" ${p.abi ? "checked" : ""}> Marque AB InBev</label>
    </div>
    <p class="hint" id="pErr" style="color:var(--danger);margin:0"></p>
    <div class="btn-row">
      <button class="btn primary" id="pSave" style="flex:1">${editing ? "Enregistrer" : "Ajouter"}</button>
      ${editing ? `<button class="btn" id="pDup">Dupliquer</button><button class="btn danger" id="pDel">Supprimer</button>` : ""}
      <button class="btn ghost" id="pCancel">Annuler</button>
    </div>`;
  let seg = p.segment || "pack";
  $("#pSeg").onclick = e => { const b = e.target.closest("[data-v]"); if (!b) return; seg = b.dataset.v; $("#pSeg").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); };
  const read = () => ({ marque: $("#pMarque").value.trim(), nom: $("#pNom").value.trim(), format: $("#pFormat").value.trim(), largeur: num($("#pLarg").value), segment: seg, abi: $("#pAbi").checked });
  $("#pMarque").addEventListener("change", () => { const ex = REF.produits.find(x => x.marque.toLowerCase() === $("#pMarque").value.trim().toLowerCase()); if (ex) $("#pAbi").checked = ex.abi; });
  $("#pFormat").addEventListener("change", () => { const ex = REF.produits.find(x => x.format === $("#pFormat").value.trim()); if (ex && !$("#pLarg").value) $("#pLarg").value = ex.largeur; });
  $("#pSave").onclick = () => {
    const v = read();
    if (!v.marque || !v.format || !v.largeur) { $("#pErr").textContent = "Renseignez au moins la marque, le format et une largeur supérieure à 0."; return; }
    if (editing) Object.assign(p, v);
    else if (local && !canEditRef) R.locaux.push({ id: uid(), ...v });
    else REF.produits.push({ id: uid(), ...v });
    if (local && !canEditRef) saveDraft(); else saveRef();
    $("#dlg").close(); renderRef(); renderFacings(); refreshLive();
    toast(editing ? "Produit enregistré" : "Produit ajouté");
  };
  if (editing) {
    $("#pDup").onclick = () => { const v = read(); const copy = { id: uid(), ...v, format: v.format + " (copie)" }; REF.produits.push(copy); saveRef(); productForm(copy); renderRef(); };
    $("#pDel").onclick = () => { if (removeProduct(p)) $("#dlg").close(); };
  }
  $("#pCancel").onclick = () => $("#dlg").close();
  $("#dlg").showModal();
}

/* Import en masse depuis Excel */
function pasteForm() {
  $("#dlgBody").innerHTML = `
    <h3 style="font-size:24px">Coller depuis Excel</h3>
    <p class="hint" style="margin:0">Copiez les colonnes dans cet ordre : Marque, Produit, Format, Largeur (cm), Segment (Pack ou CAB), AB InBev (Oui ou Non). Un produit déjà présent (même marque, produit et format) voit sa largeur mise à jour.</p>
    <textarea id="pasteTxt" placeholder="Leffe&#9;Blonde&#9;Pack 12x25cl&#9;26&#9;Pack&#9;Oui"></textarea>
    <p class="hint" id="pasteInfo" style="margin:0"></p>
    <div class="btn-row"><button class="btn primary" id="pasteGo" style="flex:1">Importer</button><button class="btn ghost" id="pasteCancel">Annuler</button></div>`;
  const parse = () => $("#pasteTxt").value.split(/\r?\n/).map(l => l.split(/\t|;/).map(s => s.trim())).filter(c => c.length >= 4 && c[0] && num(c[3]) > 0);
  $("#pasteTxt").oninput = () => { $("#pasteInfo").textContent = `${parse().length} ligne(s) valide(s) détectée(s)`; };
  $("#pasteGo").onclick = () => {
    const rows = parse(); if (!rows.length) { $("#pasteInfo").textContent = "Aucune ligne valide : vérifiez l'ordre des colonnes et la largeur."; return; }
    let add = 0, upd = 0;
    rows.forEach(([marque, nom = "", format = "", larg, seg = "pack", abi = ""]) => {
      const v = { marque, nom, format, largeur: num(larg), segment: /cab|cave/i.test(seg) ? "cab" : "pack", abi: /^(o|oui|y|yes|x|1|vrai|true)/i.test(abi) };
      const ex = REF.produits.find(p => p.marque.toLowerCase() === marque.toLowerCase() && p.nom.toLowerCase() === nom.toLowerCase() && p.format.toLowerCase() === format.toLowerCase());
      if (ex) { Object.assign(ex, v); upd++; } else { REF.produits.push({ id: uid(), ...v }); add++; }
    });
    REF.exemple = false; saveRef(); $("#dlg").close(); renderRef(); refreshLive();
    toast(`${add} ajouté(s), ${upd} mis à jour`);
  };
  $("#pasteCancel").onclick = () => $("#dlg").close();
  $("#dlg").showModal();
}
$("#dlg").addEventListener("click", e => { if (e.target === $("#dlg")) $("#dlg").close(); });

/* ------------------------------------------------------------------ */
/* Démarrage + base partagée                                           */
/* ------------------------------------------------------------------ */

/* ------------------------------------------------------------------ */
/* Publication du référentiel (auteur uniquement)                      */
/* ------------------------------------------------------------------ */
function renderPublishBar() {
  const bar = $("#pubBar"); if (!bar) return;
  if (!isAdmin || !canEditRef || !refDirty) { bar.hidden = true; return; }
  bar.hidden = false;
  $("#pubGo").textContent = artifactApi ? "Publier pour tous les M1" : "Télécharger la page à jour";
  $("#pubMsg").textContent = artifactApi
    ? "Vos modifications ne sont visibles que par vous tant qu'elles ne sont pas publiées."
    : "Téléchargez la page à jour puis remplacez le fichier hébergé : les M1 verront le nouveau référentiel.";
}
function buildDocument(ref) {
  const json = JSON.stringify(ref).replace(/</g, "\\u003c");
  const css = document.getElementById("css").textContent;
  const markup = document.getElementById("markup").innerHTML;
  const app = document.getElementById("app").textContent;
  const S = "scr" + "ipt";
  return `<!DOCTYPE html>\n<html lang="fr">\n<head>\n${HEAD_TAGS}\n<style id="css">${css}</style>\n</head>\n<body>\n<template id="markup">${markup}</template>\n<${S} id="ref-data" type="application/json">${json}</${S}>\n<${S} id="app">${app}</${S}>\n</body>\n</html>\n`;
}
function downloadPage() {
  const next = { ...JSON.parse(JSON.stringify(REF)), supprimes: [], rev: (PUBLISHED.rev || 0) + 1 };
  const blob = new Blob([buildDocument(next)], { type: "text/html" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "index.html";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast("Page téléchargée : remplacez le fichier hébergé");
}
async function publishRef() {
  if (!artifactApi) { downloadPage(); return; }
  const btn = $("#pubGo"); btn.disabled = true; btn.textContent = "Publication…";
  const next = { ...JSON.parse(JSON.stringify(REF)), supprimes: [], rev: (PUBLISHED.rev || 0) + 1 };
  try {
    await artifactApi.publish(buildDocument(next));
    LS.set("pdl.refDraft.v2", null); refDirty = false;
    toast("Référentiel publié");
  } catch (e) {
    const code = e && e.code;
    if (code === "not_granted" || code === "not_writer") {
      isAdmin = false; canEditRef = REFERENTIEL_MODIFIABLE_PAR_TOUS;
      if (!canEditRef) { REF = structuredClone(PUBLISHED); refDirty = false; LS.set("pdl.refDraft.v2", null); }
      renderPublishBar(); renderRef(); refreshLive(); toast("Seul l'auteur de l'application peut publier le référentiel");
    } else if (code === "conflict") {
      toast("Une autre version vient d'être publiée, la page se recharge");
    } else {
      toast("Publication impossible, réessayez");
    }
  } finally { btn.disabled = false; renderPublishBar(); }
}
document.addEventListener("click", e => {
  if (e.target.closest("#pubGo")) publishRef();
  if (e.target.closest("#pubUndo")) {
    if (!confirm("Annuler toutes les modifications non publiées ?")) return;
    REF = structuredClone(PUBLISHED); refDirty = false; LS.set("pdl.refDraft.v2", null);
    setSync("Référentiel à jour"); renderRef(); renderElems(); renderMobs(); refreshLive();
  }
});

/* ------------------------------------------------------------------ */
/* Démarrage                                                           */
/* ------------------------------------------------------------------ */
function applyDraftIfAny() {
  const d = LS.get("pdl.refDraft.v2", null);
  if (!d || !d.ref) return;
  if ((d.baseRev || 0) === (PUBLISHED.rev || 0)) { REF = d.ref; refDirty = true; return; }
  // Nouvelle version du référentiel commun : on la prend et on y rajoute les ajouts faits sur ce téléphone
  if (isAdmin) { LS.set("pdl.refDraft.v2", null); return; }
  const merged = structuredClone(PUBLISHED);
  merged.supprimes = d.ref.supprimes || [];
  merged.produits = merged.produits.filter(p => !merged.supprimes.includes(p.id));
  for (const list of ["produits", "elements", "mobiliers"]) {
    for (const item of d.ref[list] || []) if (!isPublished(list, item.id)) merged[list].push(item);
  }
  REF = merged; refDirty = true;
  LS.set("pdl.refDraft.v2", { baseRev: PUBLISHED.rev || 0, ref: REF });
}
if (!window.claude || !window.claude.use) {
  // Page hébergée hors claude.ai : ajoutez ?admin à l'adresse pour préparer le référentiel commun
  isAdmin = new URLSearchParams(location.search).has("admin");
  canEditRef = REFERENTIEL_MODIFIABLE_PAR_TOUS || isAdmin;
  if (canEditRef) applyDraftIfAny();
  setSync(isAdmin ? (refDirty ? "Modifications non téléchargées" : "Mode administrateur") : refDirty ? "Référentiel modifié sur cet appareil" : "Référentiel à jour");
} else {
  if (canEditRef) applyDraftIfAny();
  setSync("Référentiel à jour");
}
renderRayon();

(async function connect() {
  if (!window.claude || !window.claude.use) return;
  try {
    const art = await window.claude.use("artifact");
    if (!art) return;
    artifactApi = art; isAdmin = true; canEditRef = true; applyDraftIfAny();
    setSync(refDirty ? "Modifications non publiées" : "Référentiel à jour");
    renderElems(); renderMobs(); refreshLive(); renderPublishBar();
    if ($("#v-ref").classList.contains("on")) renderRef();
  } catch { /* lecture seule */ }
})();

</script>
